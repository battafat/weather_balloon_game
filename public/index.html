    async function fetchSuggestions(query) {
        //guard clause
        if (query < 3 || !query) {
          return [];
        }
        try {
          // try to fetch suggestions from google API through server; async
          const res = await fetch(`/autocomplete?input=${encodeURIComponent(query)}`);
          // guard clause to check if the fetch returned anything.
          if (!res.ok) {
            return []
          }
          console.log("Did the server route work?: ", res);
          // parse the fetch response into json
          const suggestions = await res.json();
          console.log("did the fetch and parse work?: ", suggestions);
          //answer: yes, it worked!
          const parsedSuggestions = (suggestions.suggestions || []).map((item) => {
            const pp = item.placePrediction;
            return {
              description: pp.text?.text || pp.structuredFormat?.mainText?.text || "",
              id: item.placeID
            };
          });
          return parsedSuggestions
        } catch (error) {
          console.log("fetchFailed: ", error);
          return []
        }
        
      }

    function setupInput(inputEl, suggestionsEl, setter) {
        // const promise = fetchSuggestions("denver");
        // console.log("this is the promise: ", promise)
        inputEl.addEventListener("input", async () => {
          suggestionsEl.innerHTML = "";
          const res = await fetchSuggestions(inputEl.value);
          console.log("this is the promise: ", res);
          res.forEach(element => {
            const div = document.createElement("div");
            div.textContent = element.description;
            div.className = "suggestion-item";
            
            div.onclick = () => {
              inputEl.value = element.description;
              setter(element.description);
              suggestionsEl.innerHTML = "";
            }
            suggestionsEl.appendChild(div);
          });
        });
        
      }
